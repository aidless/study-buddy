<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>study-buddy · 我的统计</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #0f1117; color: #e4e6ef; min-height: 100vh; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 20px; }
  .card { background: #1a1d27; border: 1px solid #2d3140; border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .big { display: flex; gap: 24px; }
  .big .item strong { display: block; font-size: 28px; }
  .big .item span { font-size: 12px; color: #888; }
  .pos { color: #4ade80; } .neg { color: #f87171; }
  .day { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #262a37; font-size: 13px; }
  .day:last-child { border-bottom: 0; }
  .bar { height: 8px; background: #262a37; border-radius: 4px; width: 120px; margin-top: 4px; }
  .bar i { display: block; height: 100%; border-radius: 4px; background: #4ade80; }
  label { display: block; font-size: 13px; color: #aaa; margin-bottom: 6px; }
  input[type=text] { width: 100%; background: #14161f; border: 1px solid #2d3140; color: #e4e6ef; border-radius: 8px; padding: 10px 12px; font-size: 14px; }
  button { background: #4a6cf7; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font-size: 14px; cursor: pointer; }
  .foot { color: #666; font-size: 11.5px; line-height: 1.7; margin-top: 24px; }
  a { color: #4a6cf7; text-decoration: none; }
  .note { color: #888; font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>我的统计</h1>
  <div class="sub">before(自报基线) vs after(实测完成率) · <a href="/buddy/">← 回到今日</a></div>

  <div class="card">
    <label>昵称</label>
    <div style="display:flex; gap:10px;">
      <input type="text" id="user" placeholder="你的昵称">
      <button id="go">查看</button>
    </div>
  </div>

  <div id="out"></div>

  <div class="foot">
    诚实边界：before 是自报数字（回忆偏差），after 是勾选实测（自评宽松偏差）。<br>
    差值方向可参考，幅度别太当真；单人样本不构成因果结论。
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const nick = new URLSearchParams(location.search).get('user') || localStorage.getItem('buddy_nick') || '';
$('user').value = nick;
$('go').onclick = load;
if (nick) load();

async function load() {
  const u = $('user').value.trim();
  if (!u) return;
  localStorage.setItem('buddy_nick', u);
  const r = await fetch('/buddy/api/stats?user=' + encodeURIComponent(u));
  const s = await r.json();
  if (!r.ok) { $('out').innerHTML = '<div class="card">加载失败</div>'; return; }
  if (!s.days_planned) { $('out').innerHTML = '<div class="card">还没有记录，先去 <a href="/buddy/">写今日计划</a></div>'; return; }

  let deltaHtml = '—';
  if (s.delta !== null) {
    const pct = Math.round(s.delta * 100);
    deltaHtml = '<span class="' + (pct >= 0 ? 'pos' : 'neg') + '">' + (pct >= 0 ? '+' : '') + pct + ' pt</span>';
  }
  const afterHtml = s.after_rate === null ? '—' : Math.round(s.after_rate * 100) + '%';
  const baseHtml = s.baseline_pct === null ? '未登记' : s.baseline_pct + '%';

  let rows = '';
  [...s.days].reverse().forEach(d => {
    const pct = d.rate === null ? 0 : Math.round(d.rate * 100);
    rows += '<div class="day"><span>' + d.date + '</span>' +
      '<span>' + d.done + '/' + d.planned + '（' + pct + '%）</span>' +
      '<span class="bar"><i style="width:' + pct + '%"></i></span></div>';
  });

  $('out').innerHTML =
    '<div class="card"><div class="big">' +
      '<div class="item"><strong>' + baseHtml + '</strong><span>before · 自报基线</span></div>' +
      '<div class="item"><strong>' + afterHtml + '</strong><span>after · ' + s.days_planned + ' 天实测均值</span></div>' +
      '<div class="item"><strong>' + deltaHtml + '</strong><span>差值（方向参考）</span></div>' +
    '</div><div class="note">连续全勾天数：' + s.perfect_streak + ' · 开始使用：' + (s.since || '—') + '</div></div>' +
    '<div class="card">' + rows + '</div>';
}
</script>
</body>
</html>
