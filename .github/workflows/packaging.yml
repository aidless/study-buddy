name: Packaging
on:
  push:
    branches:
    - main
    - master
  pull_request: null
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - name: Build distributions
      run: "set -euo pipefail\npython -m pip install --quiet build\nif ls pyproject.toml\
        \ setup.py setup.cfg >/dev/null 2>&1; then\n  python -m build --sdist --wheel\
        \ --outdir dist/\nelse\n  echo \"no python packaging metadata; skipping\"\n\
        fi\n"
    - name: Upload dist artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: dist
        path: dist/
