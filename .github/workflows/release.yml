name: Release
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - run: npm ci

      - name: 写入发布密钥（CI Secrets）
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p android/keystore
          echo "$KEYSTORE_B64" | base64 -d > android/keystore/study-buddy-release.keystore
          printf 'storeFile=../keystore/study-buddy-release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEYSTORE_PASSWORD" > android/keystore.properties

      - name: 构建 release APK
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_AI_TUTOR_URL: ${{ secrets.VITE_AI_TUTOR_URL }}
        run: |
          npm run build
          npx cap sync android
          cd android && ./gradlew assembleRelease --console=plain

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: study-buddy-release
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: 发布 OTA 更新（自建更新服务）
        env:
          SB_SERVICE_ROLE: ${{ secrets.SB_SERVICE_ROLE }}
        run: node scripts/publish-update.mjs
