name: CI
on:
  push:
    branches: [main, develop, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 环境信息
        run: node -v && npm -v
      - name: 安装依赖（lock 宽容，兼容不同 npm 版本）
        run: npm install --no-audit --no-fund
      - name: 题库与逻辑单测
        run: npm test
      - name: Web 构建
        run: npm run build

  secret-scan:
    # .gitleaks.toml and .pre-commit-config.yaml are present, but a pre-commit
    # hook is opt-in, missing from a fresh clone (.git/hooks holds only *.sample),
    # bypassable with `git commit --no-verify`, and only ever inspects staged
    # content -- never history. Nothing in CI looked at secrets, so a committed
    # key would have left every other check green.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: a key leaked in an old commit is still a live key.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_NOTIFY_USER_LIST: ""
