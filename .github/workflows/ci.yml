name: CI
on:
  push:
    branches: [main, develop, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: 环境信息
        run: node -v && npm -v
      - name: 安装依赖（lock 宽容，兼容不同 npm 版本）
        run: npm install --no-audit --no-fund
      - name: 题库与逻辑单测
        run: npm test
      - name: Web 构建
        run: npm run build
