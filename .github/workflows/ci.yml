name: CI
true:
  push:
    branches:
    - main
    - develop
    - master
  pull_request: null
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 20
        cache: npm
    - name: 环境信息
      run: node -v && npm -v
    - name: 安装依赖（lock 宽容，兼容不同 npm 版本）
      run: npm install --no-audit --no-fund
    - name: 题库与逻辑单测
      run: npm test
    - name: Web 构建
      run: npm run build
  secret-scan:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        fetch-depth: 0
    - name: gitleaks (full history, CLI)
      run: "set -euo pipefail\ncurl -sSfL --retry 3 -o /tmp/gitleaks.tgz \\\n  https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz\n\
        tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks\n/tmp/gitleaks detect --source\
        \ . --redact --no-banner --verbose\n"
