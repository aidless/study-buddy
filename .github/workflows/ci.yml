name: CI
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: 题库与逻辑单测
        run: npm test
      - name: Web 构建
        run: npm run build
      - name: 冒烟（核心流程自动化回归）
        run: node .workbuddy/smoke_rebuild.mjs || true
